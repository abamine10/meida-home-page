# Browser caching: pages are always revalidated; style.css and script.js are linked with ?v=<hash>
# by build.mjs, so they can be kept for a year.
map $sent_http_content_type $cache_expires {
  default                off;
  ~^text/html            epoch;
  ~^text/css             max;
  ~javascript            max;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # relative redirects (e.g. /ar -> /ar/), so they keep https behind the proxy
  absolute_redirect off;

  # One address for the site: www goes to the apex, permanently.
  if ($host = www.getmeida.com) { return 301 https://getmeida.com$request_uri; }

  # old ?lang=ar links go to the Arabic page
  location = / {
    if ($arg_lang = ar) { return 301 /ar/; }
    try_files /index.html =404;
  }

  expires $cache_expires;

  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # The sha256 is the inline <script> in index.html that adds the "js" class; update it if that line changes.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo='; connect-src 'self' https://platform.getmeida.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  error_page 404 /404.html;
  location / { try_files $uri $uri/ =404; }
  location /fonts/ { expires 1y; }
  location /assets/ { expires 30d; }
}
